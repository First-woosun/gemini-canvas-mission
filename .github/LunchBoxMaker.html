<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>런치박스 메이커 (Lunchbox Maker)</title>
    <!-- Font Awesome (Icons) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* CSS Variables based on Design Guide */
        :root {
            --primary-color: #FF8C00; /* Dark Orange */
            --secondary-color: #4CAF50; /* Green */
            --bg-color: #FDFDFD;
            --card-bg: #FFFFFF;
            --text-main: #2D3436;
            --text-muted: #636E72;
            --border-radius: 16px;
            --shadow: 0 10px 20px rgba(0, 0, 0, 0.05);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', 'Nanum Gothic', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 40px;
        }

        header {
            width: 100%;
            background-color: var(--card-bg);
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid #F1F2F6;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        header h1 {
            color: var(--primary-color);
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            padding: 20px;
        }

        /* Home Section: Recommendation Button */
        .hero-section {
            text-align: center;
            margin-bottom: 30px;
            padding: 30px 20px;
            background: linear-gradient(135deg, #FFF9F1 0%, #FFF0E0 100%);
            border-radius: var(--border-radius);
            border: 1px solid #FFE0B2;
        }

        .hero-section p {
            color: var(--text-muted);
            margin-bottom: 15px;
            font-weight: 500;
        }

        .btn-recommend {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.1rem;
            font-weight: 700;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 140, 0, 0.4);
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        .btn-recommend:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 140, 0, 0.5);
        }

        .btn-recommend:active {
            transform: translateY(0);
        }

        /* Category Tabs */
        .category-tabs {
            display: flex;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 25px;
            overflow-x: auto;
            padding-bottom: 5px;
        }

        .tab {
            flex: 1;
            min-width: 80px;
            padding: 10px 5px;
            border-radius: 12px;
            background-color: white;
            border: 1px solid #E0E0E0;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }

        .tab i, .tab svg {
            font-size: 1.2rem;
            width: 1.2rem;
            height: 1.2rem;
            color: var(--text-muted);
            fill: currentColor;
            display: block;
        }

        .tab.active {
            border-color: var(--primary-color);
            background-color: var(--primary-color);
            color: white;
        }

        .tab.active i, .tab.active svg {
            color: white;
            fill: white;
        }

        /* Recipe Detail Card */
        #recipe-card {
            display: none; /* Initially hidden */
            background-color: var(--card-bg);
            border-radius: var(--border-radius);
            overflow: hidden;
            box-shadow: var(--shadow);
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .recipe-image {
            width: 100%;
            height: 200px;
            background-color: #F1F2F6;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 5rem;
        }

        .recipe-content {
            padding: 25px;
        }

        .recipe-header {
            margin-bottom: 20px;
        }

        .recipe-tag {
            font-size: 0.75rem;
            color: var(--secondary-color);
            font-weight: 700;
            text-transform: uppercase;
            margin-bottom: 5px;
            display: block;
        }

        .recipe-title {
            font-size: 1.6rem;
            font-weight: 800;
            margin-bottom: 10px;
        }

        .recipe-meta {
            display: flex;
            gap: 15px;
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        .recipe-meta span {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .recipe-section {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid #F1F2F6;
        }

        .section-title {
            font-size: 1rem;
            font-weight: 700;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Ingredients Checklist */
        .ingredient-list {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .ingredient-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
            padding: 8px 12px;
            background-color: #F8F9FA;
            border-radius: 8px;
            cursor: pointer;
        }

        .ingredient-item input {
            accent-color: var(--secondary-color);
            width: 16px;
            height: 16px;
        }

        /* Steps */
        .step-list {
            list-style: none;
        }

        .step-item {
            position: relative;
            padding-left: 35px;
            margin-bottom: 15px;
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .step-number {
            position: absolute;
            left: 0;
            top: 0;
            width: 24px;
            height: 24px;
            background-color: var(--primary-color);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            font-weight: bold;
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            color: var(--text-muted);
            margin-top: 50px;
        }

        .empty-state i {
            font-size: 3rem;
            margin-bottom: 15px;
            opacity: 0.3;
        }
    </style>
</head>
<body>

    <header>
        <h1>🍱 런치박스 메이커</h1>
    </header>

    <div class="container">
        <!-- Home Section -->
        <section class="hero-section">
            <p>오늘 점심은 무엇인가요?</p>
            <button class="btn-recommend" id="random-btn">
                <i class="fas fa-dice"></i> 랜덤 추천받기
            </button>
        </section>

        <!-- Category Section -->
        <div class="category-tabs">
            <button class="tab active" data-cat="all">
                <i class="fas fa-border-all"></i>
                <span>전체</span>
            </button>
            <button class="tab" data-cat="ai">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 0C12.355 6.551 17.449 11.645 23.25 12C17.449 12.355 12.355 17.449 12 23.25C11.645 17.449 6.551 12.355 0.75 12C6.551 11.645 11.645 6.551 12 0Z"/>
                </svg>
                <span>AI 추천</span>
            </button>
            <button class="tab" data-cat="speed">
                <i class="fas fa-bolt"></i>
                <span>초스피드</span>
            </button>
            <button class="tab" data-cat="diet">
                <i class="fas fa-leaf"></i>
                <span>다이어트</span>
            </button>
            <button class="tab" data-cat="budget">
                <i class="fas fa-wallet"></i>
                <span>가성비</span>
            </button>
            <button class="tab" data-cat="prep">
                <i class="fas fa-clock"></i>
                <span>전날준비</span>
            </button>
        </div>

        <!-- Recipe Display Area -->
        <div id="recipe-container">
            <div class="empty-state" id="empty-state">
                <i class="fas fa-utensils"></i>
                <p>버튼을 눌러 오늘의 도시락 메뉴를 추천받으세요!</p>
            </div>

            <article id="recipe-card">
                <div class="recipe-image" id="recipe-emoji">🍱</div>
                <div class="recipe-content">
                    <div class="recipe-header">
                        <span class="recipe-tag" id="recipe-tag">CATEGORY</span>
                        <h2 class="recipe-title" id="recipe-title">도시락 메뉴명</h2>
                        <div class="recipe-meta">
                            <span id="recipe-time"><i class="far fa-clock"></i> 15분</span>
                            <span id="recipe-diff"><i class="fas fa-signal"></i> 난이도 하</span>
                        </div>
                    </div>

                    <!-- Ingredients -->
                    <div class="recipe-section">
                        <h3 class="section-title"><i class="fas fa-shopping-basket"></i> 필요한 재료 확인</h3>
                        <div class="ingredient-list" id="ingredient-list">
                            <!-- JS will inject ingredients here -->
                        </div>
                    </div>

                    <!-- Steps -->
                    <div class="recipe-section">
                        <h3 class="section-title"><i class="fas fa-list-ol"></i> 조리 순서</h3>
                        <div class="step-list" id="step-list">
                            <!-- JS will inject steps here -->
                        </div>
                    </div>
                </div>
            </article>
        </div>
    </div>

            {

                category: "budget",

                time: "15분",
                difficulty: "하",
                tag: "가성비 (건강한 단짠)",
                ingredients: ["가지 1개", "대파 1줌", "간장 2스푼", "굴소스 1스푼", "설탕 0.5스푼"],
                steps: ["가지를 반으로 갈라 도톰하게 어슷썰기 하고, 양념장(간장, 굴소스, 설탕, 물 약간)을 섞어둡니다.", "팬에 식용유를 두르고 파기름을 낸 뒤, 가지를 넣어 수분이 나오며 부드러워질 때까지 볶습니다.", "양념장을 붓고 빠르게 졸이듯 볶아낸 뒤 따뜻한 밥 위에 얹어 완성합니다."]

        ];

        // --- App Logic ---
        const randomBtn = document.getElementById('random-btn');
        const tabs = document.querySelectorAll('.tab');
        const emptyState = document.getElementById('empty-state');
        const recipeCard = document.getElementById('recipe-card');
        
        let currentFilter = 'all';
        const apiKey = ""; // Execution environment provides this

        // Fetch AI Recipe with Exponential Backoff
        async function fetchAIRecipe(retries = 5) {
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
            const payload = {
                contents: [{ parts: [{ text: "직장인 도시락으로 싸가기 좋은 새롭고 창의적인 레시피 1개를 추천해줘. 냉장고에 있는 흔한 재료를 활용한 독창적이고 맛있는 조합이면 좋겠어." }] }],
                generationConfig: {
                    responseMimeType: "application/json",
                    responseSchema: {
                        type: "OBJECT",
                        properties: {
                            id: { type: "INTEGER", description: "임의의 고유 숫자" },
                            title: { type: "STRING", description: "레시피 이름" },
                            category: { type: "STRING", description: "무조건 'ai'로 설정" },
                            emoji: { type: "STRING", description: "음식과 어울리는 이모지 1개" },
                            time: { type: "STRING", description: "예: '15분'" },
                            difficulty: { type: "STRING", description: "상, 중, 하 중 택 1" },
                            tag: { type: "STRING", description: "예: 'AI 창작 레시피'" },
                            ingredients: { type: "ARRAY", items: { type: "STRING" } },
                            steps: { type: "ARRAY", items: { type: "STRING" } }
                        },
                        required: ["id", "title", "category", "emoji", "time", "difficulty", "tag", "ingredients", "steps"]
                    }
                }
            };

            let delay = 1000;
            for (let i = 0; i < retries; i++) {
                try {
                    const response = await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    if (!response.ok) throw new Error('API Error');
                    const data = await response.json();
                    const text = data.candidates?.[0]?.content?.parts?.[0]?.text;
                    if (text) return JSON.parse(text);
                } catch (err) {
                    if (i === retries - 1) throw err;
                    await new Promise(res => setTimeout(res, delay));
                    delay *= 2;
                }
            }
        }

        // Filter Selection
        tabs.forEach(tab => {
            tab.addEventListener('click', () => {
                tabs.forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                currentFilter = tab.dataset.cat;
                
                recommend();
            });
        });

        // Recommendation Logic
        async function recommend() {
            if (currentFilter === 'ai') {
                // Show loading state
                recipeCard.style.display = 'none';
                emptyState.style.display = 'block';
                emptyState.innerHTML = '<i class="fas fa-robot fa-bounce" style="font-size: 3rem; margin-bottom: 15px; color: #9C27B0;"></i><p style="color: var(--text-muted); line-height: 1.5;">AI 셰프가 창의적인 레시피를 고민 중입니다...<br><small>(약 3~5초 정도 소요됩니다)</small></p>';
                
                try {
                    const aiRecipe = await fetchAIRecipe();
                    // 사용자가 대기 중에 다른 탭으로 이동하지 않았을 경우에만 표시
                    if (currentFilter === 'ai') { 
                        displayRecipe(aiRecipe);
                    }
                } catch (error) {
                    if (currentFilter === 'ai') {
                        emptyState.innerHTML = '<i class="fas fa-exclamation-triangle" style="font-size: 3rem; margin-bottom: 15px; color: #FF5252;"></i><p style="color: var(--text-muted);">AI 연결에 실패했습니다. 잠시 후 다시 시도해주세요.</p>';
                    }
                }
                return;
            }

            const pool = currentFilter === 'all' 
                ? recipes 
                : recipes.filter(r => r.category === currentFilter);
            
            if (pool.length === 0) return;

            const randomRecipe = pool[Math.floor(Math.random() * pool.length)];
            displayRecipe(randomRecipe);
        }

        // Display UI
        function displayRecipe(recipe) {
            emptyState.style.display = 'none';
            recipeCard.style.display = 'block';

            document.getElementById('recipe-emoji').textContent = recipe.emoji;
            document.getElementById('recipe-tag').textContent = recipe.tag;
            document.getElementById('recipe-title').textContent = recipe.title;
            document.getElementById('recipe-time').innerHTML = `<i class="far fa-clock"></i> ${recipe.time}`;
            document.getElementById('recipe-diff').innerHTML = `<i class="fas fa-signal"></i> 난이도 ${recipe.difficulty}`;

            // Ingredients
            const ingList = document.getElementById('ingredient-list');
            ingList.innerHTML = '';
            recipe.ingredients.forEach(ing => {
                const label = document.createElement('label');
                label.className = 'ingredient-item';
                label.innerHTML = `<input type="checkbox"> <span>${ing}</span>`;
                ingList.appendChild(label);
            });

            // Steps
            const stepList = document.getElementById('step-list');
            stepList.innerHTML = '';
            recipe.steps.forEach((step, index) => {
                const div = document.createElement('div');
                div.className = 'step-item';
                div.innerHTML = `<span class="step-number">${index + 1}</span> ${step}`;
                stepList.appendChild(div);
            });

            // Save to sessionStorage
            sessionStorage.setItem('last_viewed_recipe', JSON.stringify(recipe));
        }

        randomBtn.addEventListener('click', recommend);

        // Check for last viewed on load
        window.addEventListener('load', () => {
            const last = sessionStorage.getItem('last_viewed_recipe');
            if (last) {
                displayRecipe(JSON.parse(last));
            }
        });
    </script>
