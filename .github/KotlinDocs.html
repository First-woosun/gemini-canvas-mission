val length: Int? = nullableName?.length

val safeLength: Int = nullableName?.length ?: 0

suspend fun fetchUserData(): User {
    // IO 스레드에서 백그라운드 작업 수행
    return withContext(Dispatchers.IO) {
        api.getUser() 
    }
}

class UserViewModel : ViewModel() {
    fun loadUser() {
        // viewModelScope를 통해 코루틴 실행
        viewModelScope.launch {
            // 메인 스레드에서 UI 업데이트 코드처럼 작성되지만 블로킹되지 않음
            val user = fetchUserData()
            uiState.value = user
        }
    }
}`

    data class Success(val data: List<String>) : UiState() // 데이터를 갖는 경우 data class
    data class Error(val exception: Throwable) : UiState()
}

fun render(state: UiState) {
    // 모든 상태를 분기했으므로 else가 필요 없음
    when (state) {
        is UiState.Loading -> showProgressBar()
        is UiState.Success -> showData(state.data)

    }

fun doWork() {

        // 무거운 작업 수행

            {
                id: 20,
                title: "20. 프로퍼티와 커스텀 접근자",
                summary: "필드와 getter/setter를 하나로 묶어 프로퍼티로 제공합니다.",
                description: "코틀린의 클래스 변수(프로퍼티)는 기본적으로 뒷받침하는 필드(backing field)와 접근자를 가집니다. `get()`, `set()`을 재정의하여 커스텀 로직을 넣을 수 있습니다. 안드로이드의 View 바인딩 객체 관리나 ViewModel에서 내부 상태와 외부 노출 상태를 다르게 할 때(Backing Property) 핵심적인 역할을 합니다.",
                codeSnippet: `class Counter {
    // 커스텀 setter를 가진 프로퍼티
    var count = 0
        set(value) {
            if (value >= 0) {
                field = value // field 키워드로 실제 값(Backing Field)에 접근
            }
        }
}

class MyViewModel : ViewModel() {
    // Backing Property 패턴 (안드로이드에서 매우 흔함)
    // 내부에선 변경 가능한 MutableLiveData 사용
    private val _liveData = MutableLiveData<String>()
    
    // 외부에선 읽기 전용 LiveData로 노출 (커스텀 getter)
    val liveData: LiveData<String>
        get() = _liveData

        ];

        // DOM 요소 참조
        const navList = document.getElementById('nav-list');
        const contentContainer = document.getElementById('content-container');
        let currentActiveItem = null;

        // 사이드바 항목 렌더링
        function renderSidebar() {
            kotlinData.forEach((item, index) => {
                const button = document.createElement('button');
                button.className = 'nav-item w-full text-left px-4 py-3 text-sm text-gray-700 hover:text-gray-900 border-b border-gray-100 last:border-b-0 focus:outline-none';
                button.textContent = item.title;
                
                // 클릭 이벤트
                button.onclick = () => {
                    // 활성화 상태 스타일 변경
                    if (currentActiveItem) {
                        currentActiveItem.classList.remove('active-nav');
                    }
                    button.classList.add('active-nav');
                    currentActiveItem = button;

                    // 본문 렌더링
                    renderContent(item);
                };

                navList.appendChild(button);

                // 첫 번째 항목 기본 선택
                if (index === 0) {
                    button.click();
                }
            });
        }

        // 본문 콘텐츠 렌더링
        function renderContent(item) {
            // HTML 구조 생성
            const html = `
                <div class="animate-fade-in">
                    <span class="inline-block px-3 py-1 bg-purple-100 text-purple-700 text-xs font-semibold rounded-full mb-3">Topic ${item.id}</span>
                    <h2 class="text-3xl font-bold text-gray-900 mb-4">${item.title}</h2>
                    
                    <div class="bg-blue-50 border-l-4 border-blue-500 p-4 mb-6 rounded-r-lg">
                        <p class="text-blue-800 font-medium">${item.summary}</p>
                    </div>

                    <div class="prose max-w-none mb-8">
                        <p class="text-gray-600 leading-relaxed">${item.description.replace(/`([^`]+)`/g, '<code class="bg-gray-100 text-pink-600 px-1 py-0.5 rounded font-mono text-sm">$1</code>')}</p>
                    </div>

                    <div class="rounded-lg shadow-sm overflow-hidden bg-[#2d2d2d]">
                        <div class="flex items-center px-4 py-2 bg-[#1e1e1e] border-b border-gray-700">
                            <div class="flex gap-2">
                                <div class="w-3 h-3 rounded-full bg-red-500"></div>
                                <div class="w-3 h-3 rounded-full bg-yellow-500"></div>
                                <div class="w-3 h-3 rounded-full bg-green-500"></div>
                            </div>
                            <div class="ml-4 text-xs text-gray-400 font-mono">Example.kt</div>
                        </div>
                        <pre class="!m-0 !p-4 !bg-[#2d2d2d]"><code class="language-kotlin">${escapeHtml(item.codeSnippet)}</code></pre>
                    </div>

                    <!-- Gemini AI Chat Section -->
                    <div class="mt-10 border-t border-gray-200 pt-6 pb-4">
                        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-4">
                            <h3 class="text-lg font-bold text-gray-900 flex items-center gap-2">
                                <svg class="w-5 h-5 text-purple-600" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
                                </svg>
                                Gemini AI 어시스턴트
                            </h3>
                            <button id="quiz-btn" class="px-4 py-2 bg-purple-100 hover:bg-purple-200 text-purple-700 text-sm font-semibold rounded-lg transition-colors flex items-center gap-2 shadow-sm">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                                퀴즈 출제하기
                            </button>
                        </div>
                        <div id="chat-history" class="bg-gray-50 border border-gray-200 rounded-lg h-64 overflow-y-auto p-4 mb-4 flex flex-col gap-3 scroll-smooth">
                            <!-- Messages will be injected here -->
                        </div>
                        <div class="flex gap-2 relative">
                            <input type="text" id="chat-input" class="flex-1 border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent text-sm" placeholder="현재 문법에 대해 질문하거나 퀴즈를 요청해보세요...">
                            <button id="send-btn" class="px-5 py-2 bg-purple-600 hover:bg-purple-700 text-white text-sm font-semibold rounded-lg transition-colors flex items-center gap-2 disabled:opacity-50">
                                전송
                            </button>
                        </div>
                    </div>
                </div>
            `;
            
            contentContainer.innerHTML = html;
            
            // 본문 렌더링 후 Prism.js 문법 강조 재실행
            Prism.highlightAll();

            // --- Gemini Chat Logic ---
            if (!item.chatHistory) {
                // 카테고리별 초기 인사말 세팅
                item.chatHistory = [
                    { role: "model", text: `안녕하세요! **${item.title}**에 대해 궁금한 점이 있으신가요?` }
                ];
            }

            const chatHistoryEl = document.getElementById('chat-history');
            const chatInputEl = document.getElementById('chat-input');
            const sendBtnEl = document.getElementById('send-btn');
            const quizBtnEl = document.getElementById('quiz-btn');

            // 대화창 렌더링 함수
            function renderMessages() {
                chatHistoryEl.innerHTML = '';
                item.chatHistory.forEach(msg => {
                    const msgDiv = document.createElement('div');
                    msgDiv.className = `flex ${msg.role === 'user' ? 'justify-end' : 'justify-start'}`;
                    
                    const bubble = document.createElement('div');
                    bubble.className = `max-w-[85%] rounded-lg px-4 py-2 text-sm leading-relaxed ${
                        msg.role === 'user' 
                        ? 'bg-purple-600 text-white rounded-br-none' 
                        : 'bg-white border border-gray-200 text-gray-800 rounded-bl-none shadow-sm'
                    }`;
                    
                    // 간단한 마크다운(굵은 글씨 및 줄바꿈) 처리
                    let formattedText = msg.text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
                    formattedText = formattedText.replace(/\n/g, '<br>');
                    
                    bubble.innerHTML = formattedText;
                    msgDiv.appendChild(bubble);
                    chatHistoryEl.appendChild(msgDiv);
                });
                chatHistoryEl.scrollTop = chatHistoryEl.scrollHeight;
            }

            renderMessages();

            // 메시지 전송 핸들러
            async function handleSendMessage(text) {
                if (!text.trim()) return;

                item.chatHistory.push({ role: "user", text: text });
                renderMessages();
                chatInputEl.value = '';

                // 전송 중 UI 잠금 및 로딩 표시
                sendBtnEl.disabled = true;
                chatInputEl.disabled = true;
                quizBtnEl.disabled = true;
                
                const loadingDiv = document.createElement('div');
                loadingDiv.className = 'flex justify-start text-sm text-gray-500 italic';
                loadingDiv.innerHTML = '<div class="bg-gray-100 rounded-lg px-4 py-2 border border-gray-200">답변 생성 중...</div>';
                loadingDiv.id = 'typing-indicator';
                chatHistoryEl.appendChild(loadingDiv);
                chatHistoryEl.scrollTop = chatHistoryEl.scrollHeight;

                // 시스템 프롬프트: 현재 보고 있는 문법 주제를 주입
                const systemInstruction = `당신은 친절한 안드로이드 코틀린 전문가입니다. 현재 사용자는 '${item.title}' 문법에 대해 학습 중입니다. 코틀린 공식 문서를 기반으로 정확하고 쉽게 답변해주세요.`;
                
                // 첫 인사말은 제외하고 실제 대화 내용만 API로 전송
                const contents = item.chatHistory
                    .filter((msg, idx) => !(idx === 0 && msg.role === 'model')) 
                    .map(msg => ({
                        role: msg.role === 'model' ? 'model' : 'user',
                        parts: [{ text: msg.text }]
                    }));

                const reply = await callGeminiAPI(contents, systemInstruction);
                
                const indicator = document.getElementById('typing-indicator');
                if (indicator) indicator.remove();

                item.chatHistory.push({ role: "model", text: reply });
                renderMessages();

                // UI 잠금 해제
                sendBtnEl.disabled = false;
                chatInputEl.disabled = false;
                quizBtnEl.disabled = false;
                chatInputEl.focus();
            }

            sendBtnEl.onclick = () => handleSendMessage(chatInputEl.value);
            chatInputEl.onkeypress = (e) => {
                if (e.key === 'Enter') handleSendMessage(chatInputEl.value);
            };

            // 퀴즈 생성 버튼 이벤트
            quizBtnEl.onclick = () => {
                handleSendMessage("현재 문법에 대한 객관식 퀴즈 1문제를 출제해줘. 정답은 바로 알려주지 말고 문제와 보기만 제시해줘.");
            };
        }

        // HTML 태그 이스케이프 함수 (코드 스니펫 안전한 렌더링)
        function escapeHtml(unsafe) {
            return unsafe
                 .replace(/&/g, "&amp;")
                 .replace(/</g, "&lt;")
                 .replace(/>/g, "&gt;")
                 .replace(/"/g, "&quot;")
                 .replace(/'/g, "&#039;");
        }

        // Gemini API 연동 설정
        const apiKey = ""; // 런타임 환경에서 제공됨

        async function callGeminiAPI(contents, systemInstruction) {
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
            const payload = {
                contents: contents,
                systemInstruction: { parts: [{ text: systemInstruction }] }
            };

            let delay = 1000;
            // 지수 백오프 방식 적용 (재시도 최대 5회)
            for (let i = 0; i < 5; i++) {
                try {
                    const response = await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                    const result = await response.json();
                    return result.candidates?.[0]?.content?.parts?.[0]?.text || "응답을 생성할 수 없습니다.";
                } catch (error) {
                    if (i === 4) return "오류가 발생했습니다. 잠시 후 다시 시도해주세요.";
                    await new Promise(res => setTimeout(res, delay));
                    delay *= 2;
                }
            }
        }

        // 초기화
        document.addEventListener('DOMContentLoaded', () => {
            renderSidebar();
        });
    </script>
